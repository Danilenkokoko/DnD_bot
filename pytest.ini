# pytest.ini
# Конфигурация для pytest

[pytest]
# Минимальная версия
minversion = 7.0

# Директории с тестами
testpaths = tests

# Шаблон поиска тестов
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Добавляем корневую директорию в PYTHONPATH
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --cov=engine
    --cov=services
    --cov=handlers
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    --cov-report=json
    --cov-config=.coveragerc

# Маркеры
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests (require database)
    unit: marks tests as unit tests (fast, no dependencies)
    smoke: marks tests as smoke tests (quick sanity checks)
    engine: marks tests for engine module
    services: marks tests for services module
    handlers: marks tests for handlers module

# Логирование
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Фильтры предупреждений
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*U.*mode is deprecated:DeprecationWarning

# Таймаут для тестов (в секундах)
timeout = 30

# Параллельный запуск (если установлен pytest-xdist)
# addopts += -n auto

# JUnit XML отчёт
junit_family = xunit2
junit_logging = all
junit_duration_report = call